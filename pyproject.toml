[project]
name = "app-store-insides"
version = "0.1.0"
description = "A tool for analyzing and classifying app store feedback from Apple App Store and Google Play Store"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "app-store-web-scraper>=0.2.0",
    "google-play-scraper>=1.2.7",
    "jupyter>=1.1.1",
    "notebook>=6.5.7",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.260113",
    "plotly[express]>=6.5.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_store_insides"]
